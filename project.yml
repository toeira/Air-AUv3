name: Air
options:
  bundleIdPrefix: pt.amadeumagalhaes
  deploymentTarget:
    iOS: '12.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    IPHONEOS_DEPLOYMENT_TARGET: '12.0'
    TARGETED_DEVICE_FAMILY: 1,2
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '3'
    ENABLE_BITCODE: false
    GCC_PREPROCESSOR_DEFINITIONS:
    - $(inherited)
    - WDL_FFT_REALSIZE=8
targets:
  AirApp:
    type: application
    platform: iOS
    productName: Air
    sources:
    - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.amadeumagalhaes.air
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Air
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
        - arm64
    dependencies:
    - target: AirExtension
      embed: true
    - sdk: UIKit.framework
  AirExtension:
    type: app-extension
    platform: iOS
    sources:
    - path: Sources/Extension
    - path: Sources/DSP
      excludes:
      - '**/LICENSE*'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.amadeumagalhaes.air.auv3
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Extension/Bridge.h
        HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(SRCROOT)/Sources/DSP
        - $(SRCROOT)/Sources/DSP/Compat
        - $(SRCROOT)/Sources/DSP/BlueLab
        - $(SRCROOT)/Sources/DSP/WDL
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Extension-Info.plist
      properties:
        CFBundleDisplayName: Air AUv3
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: AirViewController
          NSExtensionAttributes:
            AudioComponents:
            - name: 'Amadeu: Air (BlueLab DSP)'
              description: Harmonic and air remixer based on BlueLab Air 6.2.4
              manufacturer: AmMg
              type: aufx
              subtype: ArBL
              version: 65536
              sandboxSafe: true
              tags:
              - Effects
              - Filter
    dependencies:
    - sdk: AudioToolbox.framework
    - sdk: AVFoundation.framework
    - sdk: CoreAudioKit.framework
    - sdk: UIKit.framework
schemes:
  AirApp:
    build:
      targets:
        AirApp: all
        AirExtension: all
    run:
      config: Debug
    archive:
      config: Release
